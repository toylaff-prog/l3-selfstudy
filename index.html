const synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;
let voice = null;
function pickVoice() { if (!synth) return; const vs = synth.getVoices(); voice = vs.find(v => /en[-_]US/i.test(v.lang) && /Google|Samantha|Jenny|Aria|Microsoft/i.test(v.name)) || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; }
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
let warned = false;
function noVoice() {
  if (warned) return; warned = true;
  const t = document.createElement("div");
  t.setAttribute("role", "status");
  t.style.cssText = "position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom, 0px));max-width:520px;margin:0 auto;background:var(--surface);color:var(--ink);border:2px solid var(--orange);border-radius:12px;padding:12px 16px;z-index:20";

  document.body.appendChild(t);
  setTimeout(() => t.remove(), 6000);
}
function plain(s) { return s.replace(/\*\*|\[\[|\]\]/g, "").replace(/<[^>]+>/g, ""); }
function speak(text, el) {
  if (!synth) { noVoice(); return; }
  synth.cancel();
  const u = new SpeechSynthesisUtterance(plain(text));
  u.lang = "en-US"; if (voice) u.voice = voice; u.rate = 0.8;
  if (el) { u.onstart = () => el.classList.add("playing"); u.onend = () => el.classList.remove("playing"); }

function fmt(s) { return s.replace(/\*\*(.+?)\*\*/g, '<b class="g">$1</b>').replace(/\[\[(.+?)\]\]/g, '<b class="v">$1</b>'); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* quiz engine: wrong answers can retry; score = first-try correct */
function renderQuiz(stage, s, items, onFinish) {
  let answered = 0, firstRight = 0;
  const wrap = document.createElement("div");
  if (s.intro) wrap.innerHTML = `<div class="box tint"><p>${s.intro}</p></div>`;
  wrap.insertAdjacentHTML("beforeend", `<p class="muted">選一個答案；答錯可以再選一次。</p>`);
  items.forEach((it, qi) => {
    const q = document.createElement("div"); q.className = "q";
    q.innerHTML = `<div class="stem">${fmt(it.q)}</div><div class="opts"></div><div class="fb" role="status" aria-live="polite"></div>`;
    const opts = q.querySelector(".opts"), fb = q.querySelector(".fb");
    let tries = 0, solved = false;
    it.options.forEach((o, oi) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "opt";
      b.innerHTML = `(${String.fromCharCode(65 + oi)}) ${fmt(o)}`;
      b.addEventListener("click", () => {
        if (solved) return;
        tries++;
        if (oi === it.answer) {
          solved = true; b.classList.add("right"); answered++; if (tries === 1) firstRight++;
          fb.className = "fb ok"; fb.innerHTML = `答對了！<span class="ex">${fmt(it.ex)}</span>`;
          if (answered === items.length) finish();
        } else { b.classList.add("wrong"); fb.className = "fb no"; fb.textContent = "再想想看，換一個答案試試。"; }
      });
      opts.appendChild(b);
    });
    wrap.appendChild(q);
  });
  const end = document.createElement("div");
  wrap.appendChild(end);
  stage.appendChild(wrap);
  function finish() {
    const best = Math.max(store.best[s.id] || 0, firstRight); store.best[s.id] = best; save();
    end.innerHTML = `<div class="box"><p class="score">全部完成！第一次就答對 ${firstRight}／${items.length} 題</p><p class="muted">最佳紀錄：${best}／${items.length}。${firstRight === items.length ? "全對，太厲害了！" : "錯的題目再看一次說明，下次會更好。"}</p></div>`;
    const again = document.createElement("button"); again.type = "button"; again.className = "btn"; again.textContent = "再做一次";
    again.addEventListener("click", () => { stage.innerHTML = ""; (onFinish ? onFinish.restart : () => RENDER[s.type](stage, s))(); });
    end.firstChild.appendChild(again);
    markDone(s.id);
    end.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

  },
  match(stage, s) {
    const rounds = [];
    READING.forEach(p => { for (let i = 0; i < p.s.length; i += 4) rounds.push({ label: "課文" + p.label, pairs: p.s.slice(i, i + 4).map(x => [x[0], x[1]]) }); });
    const lines = DIALOGUE.flatMap(c => c.lines);
    for (let i = 0; i < lines.length; i += 4) rounds.push({ label: `對話（第 ${i / 4 + 1} 組）`, pairs: lines.slice(i, i + 4).map(x => [x[1], x[2]]) });
    let r = 0;
    function play() {
      const R = rounds[r], n = R.pairs.length;
      const order = n > 1 ? (() => { let o; do { o = shuffle([...Array(n).keys()]); } while (o.every((v, i) => v === i)); return o; })() : [0];
      let selE = null, selZ = null, ok = new Set(), mist = 0;
      stage.innerHTML = `<p>先點一句英文，再點意思一樣的中文。第 ${r + 1}／${rounds.length} 組：<b>${R.label}</b></p><div class="prog" style="margin-bottom:12px"><span style="width:${Math.round(100 * r / rounds.length)}%"></span></div>
        <div class="mboard"><div class="mcol" id="mE"></div><div class="mcol" id="mZ"></div></div><div class="fb" id="mFb" role="status" aria-live="polite"></div>

      const E = stage.querySelector("#mE"), Z = stage.querySelector("#mZ"), FB = stage.querySelector("#mFb");
      function draw() {
        E.innerHTML = ""; Z.innerHTML = "";
        R.pairs.forEach((p, i) => { const b = document.createElement("button"); b.type = "button"; b.className = "mc" + (ok.has(i) ? " ok" : "") + (selE === i ? " sel" : ""); b.innerHTML = fmt(p[0]); b.addEventListener("click", () => { if (ok.has(i)) return; selE = selE === i ? null : i; check(); }); E.appendChild(b); });
        order.forEach(i => { const b = document.createElement("button"); b.type = "button"; b.dataset.i = i; b.className = "mc" + (ok.has(i) ? " ok" : "") + (selZ === i ? " sel" : ""); b.textContent = R.pairs[i][1]; b.addEventListener("click", () => { if (ok.has(i)) return; selZ = selZ === i ? null : i; check(); }); Z.appendChild(b); });
      }
      function check() {
        if (selE === null || selZ === null) { draw(); return; }
        if (selE === selZ) {
          ok.add(selE); speak(R.pairs[selE][0]); selE = selZ = null; FB.className = "fb ok"; FB.textContent = "配對成功！"; draw();
          if (ok.size === n) roundEnd();
        } else {
          mist++; const z = selZ; selZ = null; draw();
          const bad = Z.querySelector(`[data-i="${z}"]`); if (bad) bad.classList.add("bad");
          FB.className = "fb no"; FB.textContent = "意思不一樣，再找找看。";

      function roundEnd() {
        const end = stage.querySelector("#mEnd");
        const last = r === rounds.length - 1;
        end.innerHTML = `<div class="box"><p class="score">這組完成！錯了 ${mist} 次</p><p class="muted">把這幾句大聲唸一遍再繼續。</p></div>`;

        end.firstChild.appendChild(b);
        if (last) markDone(s.id);
      }
      stage.querySelector("#mHint").addEventListener("click", () => {
        let t = selE; if (t === null) { t = [...Array(n).keys()].find(i => !ok.has(i)); if (t === undefined) return; selE = t; draw(); }

      });
      stage.querySelector("#mSkip").addEventListener("click", () => { r = (r + 1) % rounds.length; play(); });
      draw();
    }
    play();
  },
  ben(stage, s) {
    stage.innerHTML = `<h2>Ben’s Job</h2><p>先讀短文（可以聽、可以遮住中文），再回答下面的問題。</p>`;
    const box = document.createElement("div");
    hideToggle(stage, box, "遮住中文（點句子看答案）");
    BEN.forEach(([en, zh]) => sentence(box, en, zh));
    stage.appendChild(box);
    stage.insertAdjacentHTML("beforeend", `<h2 style="margin-top:20px">讀一讀，回答問題</h2>`);
    renderQuiz(stage, s, QUIZ.ben);
  },
  write(stage, s) {
    const frames = [["I want to be a / an ＿＿＿＿ because I am good at ＿＿＿＿.", "I want to be a nurse because I am good at helping people."],
                    ["Boys and girls can both be ＿＿＿＿, can’t they?", "Boys and girls can both be engineers, can’t they?"]];
    stage.innerHTML = `<p>照著句型寫寫看，寫完按「聽一聽」聽自己的句子，再大聲唸一遍。寫的內容只存在這台裝置上。</p>`;
    frames.forEach(([f, ex], i) => {
      const b = document.createElement("div"); b.className = "box";
      b.innerHTML = `<p><b>句型 ${i + 1}</b>：${f}</p><p class="muted">例：${ex}</p><textarea aria-label="寫下句型 ${i + 1} 的句子">${esc(store.write[i] || "")}</textarea><div class="row" style="margin-top:8px"><button type="button" class="btn small">儲存</button><button type="button" class="btn small">聽一聽</button><span class="muted saved"></span></div>`;
      const ta = b.querySelector("textarea"), [sv, sp] = b.querySelectorAll("button"), msg = b.querySelector(".saved");
      sv.addEventListener("click", () => { store.write[i] = ta.value; save(); msg.textContent = "已儲存"; if (Object.values(store.write).some(v => v && v.trim())) markDone(s.id); });
      sp.addEventListener("click", () => { if (ta.value.trim()) speak(ta.value); });
      stage.appendChild(b);
    });
  },
  spell(stage, s) {
    stage.innerHTML = `<p>看中文，把英文單字拼出來（第一個和最後一個字母已經給你）。打完按「檢查」。</p>`;
    let right = 0, checked = new Set();
    SPELL.forEach(([zh, w], i) => {
      const q = document.createElement("div"); q.className = "q";
      const pattern = w[0] + " " + "＿ ".repeat(w.length - 2) + w[w.length - 1];
      q.innerHTML = `<div class="stem">${11 + i}. ${zh}　<span class="muted">${pattern}</span></div><div class="row"><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${zh} 的英文"><button type="button" class="btn small">檢查</button><button type="button" class="btn small">看答案</button><button type="button" class="speak">聽一聽</button></div><div class="fb" role="status" aria-live="polite"></div>`;
      const inp = q.querySelector("input"), [ck, show] = q.querySelectorAll(".btn"), fb = q.querySelector(".fb");
      const go = () => {
        if (inp.value.trim().toLowerCase() === w) { fb.className = "fb ok"; fb.textContent = "拼對了！"; if (!checked.has(i)) { checked.add(i); right++; } if (checked.size === SPELL.length) { markDone(s.id); } }
        else { fb.className = "fb no"; fb.textContent = "還不對，再試一次（可以按「聽一聽」）。"; }
      };
      ck.addEventListener("click", go);
      inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
      show.addEventListener("click", () => { fb.className = "fb"; fb.textContent = `答案：${w}`; });
      q.querySelector(".speak").addEventListener("click", () => speak(w));
      stage.appendChild(q);
    });
  }
};

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
